{% extends "base.html" %}

{% block title %}Crear una contraseña nueva{% endblock %}

{% block content %}
    <section class="auth-formulario">
        <h1>Crear una contraseña nueva</h1>
        {% if validlink %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">
                    Guardar contraseña nueva
                </button>
            </form>
        {% else %}
            <p class="auth-error" role="alert">
                El enlace no es válido o venció.
            </p>
            <a
                href="{% url 'usuarios:recuperar_contrasena' %}"
                class="btn"
            >
                Solicitar otro enlace
            </a>
        {% endif %}
    </section>
{% endblock %}
